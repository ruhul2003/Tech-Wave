<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWave</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/0398fc8d82.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>Tech<span>Wave</span></h1>
            </div>
            <div class="menu">
                <ul>
                    <li>Home</li>
                    <li>Episodes</li>
                    <li>Host</li>
                </ul>
            </div>
            <button>Subscribe <i class="fa-solid fa-arrow-right"></i></button>
        </nav>
        <hr class="line">

        <div class="banner">
            <img src="./assets/hero-circle.png" alt="">
            <img class="img2" src="./assets/microphone.png" alt="">
            <div class="new">New</div>

            <div class="texts">
                <h1>TechWave</h1>
                <p>Your daily dose of tech insights, productivity hacks, and personal growth</p>
                <div class="buttons">
                    <button class="spotify"><i class="fa-brands fa-spotify"></i> Listen on Spotify </button>
                    <button class="subscribe"><i class="fa-solid fa-envelope"></i> Subscribe </button>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
